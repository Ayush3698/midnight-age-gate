name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Compile & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (npm workspaces)
        run: npm install

      - name: Type-check contract package
        run: npx tsc -p contract/tsconfig.json --noEmit

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc -b

      - name: Run contract/unit tests
        run: npx vitest run

      - name: Build frontend
        working-directory: frontend
        run: npx vite build

  compact-compile:
    name: Compile Compact circuit
    runs-on: ubuntu-latest
    # Non-blocking for now: this job depends on however you install the
    # `compact` CLI on a fresh runner (e.g. via the Midnight installer
    # script or a cached binary), which isn't pinned here yet. The
    # circuit itself compiles cleanly locally — once you've settled on
    # an install method for CI, drop `continue-on-error` so this gates
    # merges too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install compact CLI
        run: |
          echo "Install the compact CLI per https://docs.midnight.network (installer script or cached binary), then remove this echo."
      - name: Compile age-gate.compact
        run: compact compile contract/src/age-gate.compact contract/build
